# --------------------------------------------------------------------------
# Docker Compose — Code Review API + Nginx (HTTPS)
#
# Postgres and Redis are hosted on separate remote servers.
# Their connection strings are provided via the .env file:
#   DATABASE_URL=postgresql://user:pass@remote-pg-host:5432/codereview
#   REDIS_URL=redis://remote-redis-host:6379
#
# SSL certificates:
#   Place your certs in ./nginx/ssl/ (fullchain.pem + privkey.pem)
#   For local dev, generate self-signed certs:
#     mkdir -p nginx/ssl
#     openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#       -keyout nginx/ssl/privkey.pem -out nginx/ssl/fullchain.pem \
#       -subj "/CN=localhost"
# --------------------------------------------------------------------------

services:
    # ── Nginx reverse proxy (HTTPS termination) ──────────────
    nginx:
        image: nginx:1.27-alpine
        container_name: code-review-nginx
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./nginx/ssl:/etc/nginx/ssl:ro
            - certbot-webroot:/var/www/certbot:ro
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    # ── Node.js API ──────────────────────────────────────────
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                - NODE_ENV=production
        container_name: code-review-api
        restart: unless-stopped
        expose:
            - "${PORT:-4020}"
        env_file:
            - .env
        volumes:
            - app-logs:/app/logs
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://localhost:' + (process.env.PORT || 4020) + '/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 15s

volumes:
    app-logs:
    certbot-webroot:
