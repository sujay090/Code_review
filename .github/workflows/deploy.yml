# # --------------------------------------------------------------------------
# # CI/CD — Build, Push to GHCR, and Deploy to AWS EC2
# #
# # Flow:
# #   1. CI: Lint + type-check + build (on every push & PR)
# #   2. CD: Build Docker image → push to GitHub Container Registry →
# #          SSH into EC2 → docker compose pull → restart (only on push to main)
# #
# # Required GitHub Secrets (Settings → Secrets → Actions):
# #   EC2_HOST          – Public IP or domain of your EC2 instance
# #   EC2_USER          – SSH user (usually 'ubuntu' for Ubuntu AMIs)
# #   EC2_SSH_KEY       – Private SSH key (PEM format) for the EC2 instance
# #   ENV_FILE          – Full contents of production .env file
# # --------------------------------------------------------------------------

